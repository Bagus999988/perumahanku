<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login — PerumahanKu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../perumahanku.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-login-shell">
      <div class="admin-login-card">
        <span class="logo">Perumahan<span>Ku</span></span>
        <h1>Admin Login</h1>
        <p class="hint">Khusus pemilik website. Masukkan email dan password admin.</p>

        <form id="loginForm">
          <div>
            <label for="emailInput">Email</label>
            <input type="email" id="emailInput" required autocomplete="username" />
          </div>
          <div>
            <label for="passwordInput">Password</label>
            <input type="password" id="passwordInput" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" id="loginBtn">Masuk</button>
          <p class="admin-form-status" id="loginStatus" role="status"></p>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script src="login.js"></script>
  </body>
</html>
