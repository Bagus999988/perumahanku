<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pendaftar — Admin PerumahanKu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../perumahanku.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <span class="logo">Perumahan<span>Ku</span></span>
        <nav class="admin-nav">
          <a href="index.html">🏠 Kelola Listing</a>
          <a href="submissions.html">📥 Pengajuan Properti</a>
          <a href="registrations.html">📝 Pendaftar</a>
          <a href="visitors.html">👣 Pengunjung</a>
        </nav>
        <div class="admin-user" id="adminUserLabel"></div>
        <button class="btn admin-logout" id="logoutBtn">Keluar</button>
      </aside>

      <main class="admin-main">
        <div class="admin-topbar">
          <h1>Pendaftar</h1>
          <p id="registrationCount">Memuat data...</p>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Email</th>
                <th>Telepon</th>
                <th>Pesan</th>
                <th>Tanggal Daftar</th>
              </tr>
            </thead>
            <tbody id="registrationsBody">
              <tr><td colspan="5" class="admin-loading">Memuat...</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase-config.js"></script>
    <script src="admin-common.js"></script>
    <script src="registrations.js"></script>
  </body>
</html>
